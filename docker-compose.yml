# Backing services for local dev. The API itself runs on the host
# (`pnpm --filter @zadpay/api dev`) so we get tsx hot reload.
# `docker compose up postgres redis` is enough.

services:
  postgres:
    image: postgres:16-alpine
    container_name: zadpay-postgres
    environment:
      POSTGRES_DB: zadpay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zadpay"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: zadpay-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
