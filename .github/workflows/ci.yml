  #       with: { distribution: temurin, java-version: 17 }
  #     - uses: reactivecircus/android-emulator-runner@v2
  #       with:
  #         api-level: 33
  #         script: |
  #           # Download the latest EAS preview APK + install it
  #           # See docs/e2e.md
  #           curl -sL https://get.maestro.mobile.dev | bash
  #           PATH="$PATH:$HOME/.maestro/bin" maestro test e2e/maestro
