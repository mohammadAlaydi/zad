name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight runs on the same branch — saves runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 9
  NODE_VERSION: 20

jobs:
  setup:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

  format:
    name: Prettier
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # --if-present so this is a no-op while no workspace has a test script.
      # PR-4 onwards adds real Vitest suites.
      - run: pnpm -r --if-present run test

  audit:
    name: Audit
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # --audit-level=high gates on high+critical only; medium can ship.
      # Per ADR-0010, dependency policy is "block high/critical, document medium."
      - run: pnpm audit --audit-level=high --prod

  mobile-bundle-size:
    name: Mobile bundle size
    runs-on: ubuntu-latest
    needs: setup
    # Only when mobile or shared packages changed — `expo export` is ~30 s.
    if: |
      contains(github.event.pull_request.changed_files, 'apps/mobile/') ||
      contains(github.event.pull_request.changed_files, 'packages/')   ||
      github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zadpay/mobile run bundle-size
      # Upload the dist/ artifact for source-map-explorer inspection on the
      # PR run when the budget is exceeded. 14-day retention.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-bundle-${{ github.run_id }}
          path: apps/mobile/dist
          retention-days: 14

  # mobile-e2e — Maestro flows in e2e/maestro. Needs an Android emulator
  # and either an EAS preview build or Maestro Cloud credentials. The
  # job is documented here and left disabled until PR-15 wires the EAS
  # build dependency.
