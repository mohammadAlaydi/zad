name: Mobile Release

# EAS builds, source-map upload, store submission.
# Triggers:
#   - merge to main with mobile changes  → preview build (TestFlight-eligible
#     internal distribution, no auto-submit)
#   - tag `mobile-v*`                    → production builds + manual submit
# See docs/deployment.md for the secret list.

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/mobile-release.yml"
    tags:
      - "mobile-v*"
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        type: choice
        options: [preview, production]
        default: preview

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PNPM_VERSION: 9
  NODE_VERSION: 20

jobs:
  resolve-profile:
    name: Resolve build profile
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.pick.outputs.profile }}
      is-prod: ${{ steps.pick.outputs.is-prod }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            profile="${{ inputs.profile }}"
          elif [[ "${{ github.ref }}" == refs/tags/mobile-v* ]]; then
            profile="production"
          else
            profile="preview"
          fi
          echo "profile=${profile}" >> "$GITHUB_OUTPUT"
          if [ "${profile}" = "production" ]; then
            echo "is-prod=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-prod=false" >> "$GITHUB_OUTPUT"
          fi

  eas-build:
    name: EAS build (${{ needs.resolve-profile.outputs.profile }})
    needs: resolve-profile
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.resolve-profile.outputs.is-prod == 'true' && 'mobile-production' || 'mobile-preview' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build for iOS + Android
        working-directory: apps/mobile
        run: |
          eas build \
            --profile "${{ needs.resolve-profile.outputs.profile }}" \
            --platform all \
            --non-interactive \
            --no-wait

  upload-sourcemaps:
    name: Upload source maps to Sentry
    needs: [resolve-profile, eas-build]
    if: needs.resolve-profile.outputs.is-prod == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Produce source maps locally then push to Sentry. EAS's own
      # source-map hook is the alternative but requires the @sentry/
      # react-native expo config plugin to be wired in app.json — once
      # that lands, swap this step for `eas build --auto-submit` with the
      # plugin doing the upload.
      - name: Export bundle + source maps
        working-directory: apps/mobile
        run: pnpm exec expo export --platform all --dump-sourcemap

      - name: Upload to Sentry
        if: ${{ env.SENTRY_AUTH_TOKEN != '' }}
        working-directory: apps/mobile
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT_MOBILE }}
          RELEASE: ${{ github.sha }}
        run: |
          npx @sentry/cli releases new "${RELEASE}"
          npx @sentry/cli releases files "${RELEASE}" upload-sourcemaps \
            --dist "${GITHUB_RUN_NUMBER}" \
            dist/_expo/static/js
          npx @sentry/cli releases finalize "${RELEASE}"

  submit-ios:
    name: Submit → TestFlight
    needs: [resolve-profile, eas-build, upload-sourcemaps]
    if: needs.resolve-profile.outputs.is-prod == 'true'
    runs-on: ubuntu-latest
    # Manual gate via the ios-store environment.
    environment:
      name: ios-store
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: eas submit ios
        working-directory: apps/mobile
        run: eas submit --platform ios --profile production --non-interactive --latest

  submit-android:
    name: Submit → Play Internal
    needs: [resolve-profile, eas-build, upload-sourcemaps]
    if: needs.resolve-profile.outputs.is-prod == 'true'
    runs-on: ubuntu-latest
    environment:
      name: android-store
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: eas submit android
        working-directory: apps/mobile
        run: eas submit --platform android --profile production --non-interactive --latest
